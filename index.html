<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Správa účtů</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
/* ==========================================================
   style.css – základní vzhled (tmavý motiv se zlatým akcentem)
   ========================================================== */

/* ---------- Proměnné (barvy, rádiusy) ---------- */
:root {
  --background: #0f0e0c;
  --card: #1a1814;
  --secondary: #26231d;
  --border: #38342b;
  --foreground: #f2ede2;
  --muted: #9a9484;
  --primary: #d4a94f;
  --primary-fg: #1a1508;
  --destructive: #e5584f;
  --success: #34d399;
  --radius: 10px;
}

/* ---------- Reset ---------- */
*,
*::before,
*::after { box-sizing: border-box; }

[hidden] { display: none !important; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--background);
  color: var(--foreground);
  font-family: "Inter", system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
}

/* ---------- Rozvržení ---------- */
.shell {
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 32px 16px;
}

.card {
  width: 100%;
  max-width: 512px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
}

.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
}

.title {
  margin: 0;
  font-family: "Cormorant Garamond", serif;
  font-size: 26px;
  font-weight: 500;
}

.subtitle {
  margin: 4px 0 0;
  font-size: 12px;
  color: var(--muted);
}

.section { margin-bottom: 20px; }
.section-bordered { border-top: 1px solid var(--border); padding-top: 20px; margin-bottom: 0; }
.section-bordered + .section-bordered { margin-top: 20px; }

.stack > * + * { margin-top: 12px; }

.label {
  margin: 0 0 8px;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

.muted { color: var(--muted); }

/* ---------- Formulářové prvky ---------- */
.input {
  width: 100%;
  background: var(--secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 14px;
  font: inherit;
  color: var(--foreground);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.input::placeholder { color: var(--muted); }
.input:focus {
  outline: none;
  border-color: rgba(212, 169, 79, 0.5);
  box-shadow: 0 0 0 1px rgba(212, 169, 79, 0.3);
}
.input:disabled { opacity: 0.5; }

/* ---------- Tlačítka ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  border: 1px solid transparent;
  border-radius: var(--radius);
  padding: 10px 14px;
  font: inherit;
  font-weight: 500;
  cursor: pointer;
  transition: filter 0.15s, border-color 0.15s, background 0.15s, color 0.15s;
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-primary { background: var(--primary); color: var(--primary-fg); }
.btn-primary:hover:not(:disabled) { filter: brightness(1.1); }

.btn-secondary { background: var(--secondary); border-color: var(--border); color: var(--foreground); }
.btn-secondary:hover:not(:disabled) { border-color: rgba(212, 169, 79, 0.4); }

.btn-ghost { width: auto; padding: 6px 12px; font-size: 12px; background: transparent; color: var(--muted); }
.btn-ghost:hover:not(:disabled) { color: var(--foreground); background: var(--secondary); }

.icon-btn {
  width: 28px;
  height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.icon-btn svg { width: 14px; height: 14px; fill: currentColor; }
.icon-btn.edit:hover { color: var(--primary); background: rgba(212, 169, 79, 0.1); }
.icon-btn.delete:hover { color: var(--destructive); background: rgba(229, 88, 79, 0.1); }
.icon-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ---------- Seznam účtů ---------- */
.accounts { list-style: none; margin: 0; padding: 0; }
.accounts > li + li { margin-top: 6px; }

.account {
  background: rgba(38, 35, 29, 0.4);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 12px;
}

.account-row { display: flex; align-items: center; gap: 12px; }
.account-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.badge {
  font-size: 12px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--secondary);
  color: var(--muted);
}
.badge-admin { background: rgba(212, 169, 79, 0.15); color: var(--primary); }

.edit-form {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid rgba(56, 52, 43, 0.6);
}
.edit-actions { display: flex; align-items: center; gap: 8px; }
.edit-actions .btn-primary { flex: 1; padding: 8px 14px; font-size: 12px; }

/* ---------- Zprávy ---------- */
.msg { margin: 16px 0 0; font-size: 12px; }
.msg-ok { color: var(--success); }
.msg-error { color: var(--destructive); }

/* ---------- Animace načítání ---------- */
.spinner {
  width: 12px;
  height: 12px;
  border: 1px solid currentColor;
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ==========================================================
   responsive.css – úpravy pro menší obrazovky
   ========================================================== */

@media (max-width: 560px) {
  .shell { padding: 12px 8px; }

  .card {
    padding: 18px 16px;
    border-radius: 14px;
  }

  .title { font-size: 24px; }

  /* Větší dotykové plochy na mobilu */
  .icon-btn { width: 36px; height: 36px; }
  .icon-btn svg { width: 16px; height: 16px; }

  /* Hlavička se může zalomit */
  .card-head { flex-wrap: wrap; }
}

  </style>
</head>
<body>
  <main class="shell">
    <!-- ============ PŘIHLÁŠENÍ ============ -->
    <section id="login-view" class="card" hidden>
      <header class="card-head"><div>
        <h1 class="title" id="login-title">Přihlášení</h1>
        <p class="subtitle" id="login-sub">Přihlas se jako správce.</p>
      </div></header>
      <form id="login-form" class="stack" autocomplete="on">
        <input name="username" type="text" required autocapitalize="none" spellcheck="false" autocomplete="username" placeholder="uživatelské jméno" class="input" />
        <input name="password" type="password" required autocomplete="current-password" placeholder="heslo (min. 8 znaků)" class="input" />
        <button type="submit" id="login-btn" class="btn btn-primary" data-busy-label="Pracuji…">Přihlásit se</button>
      </form>
      <p id="login-error" class="msg msg-error" role="alert" hidden></p>
    </section>

    <!-- ============ SPRÁVA ÚČTŮ ============ -->
    <section id="app-view" class="card" data-testid="accounts-panel" hidden>
      <header class="card-head">
        <div>
          <h1 class="title">Účty</h1>
          <p class="subtitle">Hosté se přihlašují uživatelským jménem a heslem.</p>
        </div>
        <button id="logout-btn" type="button" class="btn btn-ghost" title="Odhlásit se">Odhlásit</button>
      </header>

      <!-- Seznam účtů -->
      <div class="section">
        <p class="label">Existující účty</p>
        <ul id="accounts-list" class="accounts"></ul>
      </div>

      <!-- Nový host -->
      <form id="create-form" class="section section-bordered stack">
        <p class="label">Nový host</p>
        <input name="username" type="text" required autocapitalize="none" spellcheck="false"
               placeholder="uživatelské jméno" data-testid="new-username" class="input" />
        <input name="password" type="password" required minlength="8"
               placeholder="heslo (min. 8 znaků)" data-testid="new-password" class="input" />
        <button type="submit" class="btn btn-primary" data-testid="create-account"
                data-busy-label="Vytvářím…">Vytvořit účet</button>
      </form>

      <!-- Změna vlastního hesla -->
      <form id="password-form" class="section section-bordered stack">
        <p class="label">Změna mého hesla</p>
        <input name="currentPassword" type="password" required
               placeholder="současné heslo" data-testid="current-password" class="input" />
        <input name="newPassword" type="password" required minlength="8"
               placeholder="nové heslo (min. 8 znaků)" data-testid="new-own-password" class="input" />
        <button type="submit" class="btn btn-secondary" data-testid="change-password"
                data-busy-label="Ukládám…">Změnit heslo</button>
      </form>

      <!-- Zprávy -->
      <p id="notice" class="msg msg-ok" data-testid="accounts-notice" hidden></p>
      <p id="error" class="msg msg-error" data-testid="accounts-error" role="alert" hidden></p>
    </section>
  </main>
  <script>

/* ==========================================================
   Správa účtů – samostatná verze (bez serveru).
   Data jsou uložena v prohlížeči (localStorage), hesla jako PBKDF2 hash.
   ========================================================== */
const USERNAME_PATTERN = /^[a-z0-9](?:[a-z0-9._-]{1,30}[a-z0-9])$/;
const MIN_PASSWORD_LENGTH = 8;
const DB_KEY = "vault.accounts";
const SESSION_KEY = "vault.session";

const $ = (s, r = document) => r.querySelector(s);
const el = {
  loginView: $("#login-view"), loginForm: $("#login-form"), loginError: $("#login-error"),
  loginTitle: $("#login-title"), loginSub: $("#login-sub"), loginBtn: $("#login-btn"),
  appView: $("#app-view"), logoutBtn: $("#logout-btn"), list: $("#accounts-list"),
  createForm: $("#create-form"), passwordForm: $("#password-form"),
  notice: $("#notice"), error: $("#error"),
};

/* ---------- Pomocné funkce ---------- */
const normalizeUsername = (raw) => String(raw ?? "").trim().toLowerCase();
const escapeHtml = (v) => String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");

const MESSAGES = {
  USERNAME_INVALID: "Uživatelské jméno musí mít 3–32 znaků: malá písmena, číslice, tečka, pomlčka nebo podtržítko.",
  PASSWORD_TOO_SHORT: "Heslo musí mít alespoň 8 znaků.",
  USERNAME_TAKEN: "Toto uživatelské jméno už existuje.",
  CANNOT_DELETE_SELF: "Vlastní účet smazat nelze.",
  CANNOT_DELETE_ADMIN: "Účet správce smazat nelze.",
  ACCOUNT_NOT_FOUND: "Účet už neexistuje.",
  WRONG_PASSWORD: "Současné heslo není správné.",
};
const fail = (code) => { throw new Error(code); };
const describeError = (e) => MESSAGES[e?.message] ?? "Akce se nepovedla. Zkus to znovu.";

/* ---------- Hesla (PBKDF2 + sůl) ---------- */
const toHex = (buf) => [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
async function hashPassword(password, saltHex) {
  const salt = Uint8Array.from(saltHex.match(/../g).map((x) => parseInt(x, 16)));
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  return toHex(await crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations: 150000, hash: "SHA-256" }, key, 256));
}
const newSalt = () => toHex(crypto.getRandomValues(new Uint8Array(16)));
async function makeUser(username, password, isAdmin) {
  const salt = newSalt();
  return { id: crypto.randomUUID(), username, salt, hash: await hashPassword(password, salt), isAdmin };
}
const checkPassword = async (user, password) => (await hashPassword(password, user.salt)) === user.hash;

/* ---------- Úložiště ---------- */
const loadUsers = () => { try { return JSON.parse(localStorage.getItem(DB_KEY)) ?? []; } catch { return []; } };
const saveUsers = (users) => localStorage.setItem(DB_KEY, JSON.stringify(users));
const currentId = () => sessionStorage.getItem(SESSION_KEY);
const currentUser = () => loadUsers().find((u) => u.id === currentId()) ?? null;

/* ---------- Operace s účty (ekvivalent accounts.ts) ---------- */
async function createGuest(username, password) {
  const name = normalizeUsername(username);
  if (!USERNAME_PATTERN.test(name)) fail("USERNAME_INVALID");
  if (password.length < MIN_PASSWORD_LENGTH) fail("PASSWORD_TOO_SHORT");
  const users = loadUsers();
  if (users.some((u) => u.username === name)) fail("USERNAME_TAKEN");
  users.push(await makeUser(name, password, false));
  saveUsers(users);
}
async function updateAccount(id, { username, password }) {
  const users = loadUsers();
  const user = users.find((u) => u.id === id) ?? fail("ACCOUNT_NOT_FOUND");
  if (username) {
    const name = normalizeUsername(username);
    if (!USERNAME_PATTERN.test(name)) fail("USERNAME_INVALID");
    if (users.some((u) => u.username === name && u.id !== id)) fail("USERNAME_TAKEN");
  }
  if (password !== undefined && password.length < MIN_PASSWORD_LENGTH) fail("PASSWORD_TOO_SHORT");
  if (username) user.username = normalizeUsername(username);
  if (password) { user.salt = newSalt(); user.hash = await hashPassword(password, user.salt); }
  saveUsers(users);
}
function deleteAccount(id) {
  if (id === currentId()) fail("CANNOT_DELETE_SELF");
  const users = loadUsers();
  const target = users.find((u) => u.id === id);
  if (!target) return;
  if (target.isAdmin) fail("CANNOT_DELETE_ADMIN");
  saveUsers(users.filter((u) => u.id !== id));
}
async function changeMyPassword(current, next) {
  if (next.length < MIN_PASSWORD_LENGTH) fail("PASSWORD_TOO_SHORT");
  const users = loadUsers();
  const me = users.find((u) => u.id === currentId()) ?? fail("ACCOUNT_NOT_FOUND");
  if (!(await checkPassword(me, current))) fail("WRONG_PASSWORD");
  me.salt = newSalt(); me.hash = await hashPassword(next, me.salt);
  saveUsers(users);
}

/* ---------- Zprávy a stav ---------- */
const state = { editingId: null, deletingId: null };
function clearMessages() { el.notice.hidden = true; el.error.hidden = true; }
function showNotice(t) { clearMessages(); el.notice.textContent = t; el.notice.hidden = false; }
function showError(t) { clearMessages(); el.error.textContent = t; el.error.hidden = false; }
function setBusy(form, busy) {
  form.querySelectorAll("input, button").forEach((n) => (n.disabled = busy));
  const submit = form.querySelector('button[type="submit"]');
  if (!submit) return;
  if (busy) { submit.dataset.label = submit.textContent; submit.textContent = submit.dataset.busyLabel ?? "Pracuji…"; }
  else if (submit.dataset.label) submit.textContent = submit.dataset.label;
}

/* ---------- Vykreslení ---------- */
const ICON_EDIT = '<svg viewBox="0 0 16 16"><path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l10-10zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293z"/></svg>';
const ICON_DELETE = '<svg viewBox="0 0 16 16"><path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/><path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4z"/></svg>';

function rowTemplate(a) {
  const name = escapeHtml(a.username);
  const editing = state.editingId === a.id, deleting = state.deletingId === a.id;
  const del = a.isAdmin ? "" : `<button type="button" class="icon-btn delete" data-action="delete" data-testid="account-delete" title="Smazat účet" ${deleting ? "disabled" : ""}>${ICON_DELETE}</button>`;
  const form = editing ? `<form class="edit-form stack" data-form="edit" data-testid="account-edit-form">
      <input name="username" type="text" value="${name}" autocapitalize="none" spellcheck="false" placeholder="nové uživatelské jméno" class="input" />
      <input name="password" type="password" autocomplete="new-password" placeholder="nové heslo (nech prázdné pro zachování)" class="input" />
      <div class="edit-actions"><button type="submit" class="btn btn-primary" data-testid="account-save" data-busy-label="Ukládám…">Uložit změny</button>
      <button type="button" class="btn btn-ghost" data-action="cancel">Zrušit</button></div></form>` : "";
  return `<li class="account" data-id="${escapeHtml(a.id)}" data-username="${name}" data-testid="account-row">
    <div class="account-row"><span class="account-name">${name}</span>
    <span class="badge ${a.isAdmin ? "badge-admin" : ""}">${a.isAdmin ? "Admin" : "Host"}</span>
    <button type="button" class="icon-btn edit" data-action="edit" data-testid="account-edit" title="Upravit účet">${ICON_EDIT}</button>${del}</div>${form}</li>`;
}
function renderAccounts() {
  const users = [...loadUsers()].sort((a, b) => Number(b.isAdmin) - Number(a.isAdmin) || a.username.localeCompare(b.username));
  el.list.innerHTML = users.map(rowTemplate).join("");
}

/* ---------- Přepínání obrazovek ---------- */
function showLogin() {
  el.appView.hidden = true; el.loginView.hidden = false; el.loginError.hidden = true;
  const first = loadUsers().length === 0;
  el.loginForm.dataset.mode = first ? "setup" : "login";
  el.loginTitle.textContent = first ? "První spuštění" : "Přihlášení";
  el.loginSub.textContent = first ? "Vytvoř účet správce (jméno a heslo)." : "Přihlas se jako správce.";
  el.loginBtn.textContent = first ? "Vytvořit správce" : "Přihlásit se";
  $("[name=password]", el.loginForm).autocomplete = first ? "new-password" : "current-password";
}
function showApp() {
  el.loginView.hidden = true; el.appView.hidden = false; clearMessages();
  state.editingId = null; renderAccounts();
}

/* ---------- Události ---------- */
el.loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const data = new FormData(el.loginForm);
  const username = normalizeUsername(data.get("username"));
  const password = String(data.get("password") ?? "");
  el.loginError.hidden = true;
  setBusy(el.loginForm, true);
  try {
    if (el.loginForm.dataset.mode === "setup") {
      if (!USERNAME_PATTERN.test(username)) fail("USERNAME_INVALID");
      if (password.length < MIN_PASSWORD_LENGTH) fail("PASSWORD_TOO_SHORT");
      const admin = await makeUser(username, password, true);
      saveUsers([admin]);
      sessionStorage.setItem(SESSION_KEY, admin.id);
    } else {
      const user = loadUsers().find((u) => u.username === username);
      if (!user || !(await checkPassword(user, password))) throw new Error("BAD_LOGIN");
      if (!user.isAdmin) throw new Error("NOT_ADMIN");
      sessionStorage.setItem(SESSION_KEY, user.id);
    }
    el.loginForm.reset();
    showApp();
  } catch (err) {
    el.loginError.textContent = err.message === "NOT_ADMIN" ? "Do správy účtů má přístup jen správce."
      : err.message === "BAD_LOGIN" ? "Nesprávné uživatelské jméno nebo heslo." : describeError(err);
    el.loginError.hidden = false;
  } finally { setBusy(el.loginForm, false); }
});

el.logoutBtn.addEventListener("click", () => { sessionStorage.removeItem(SESSION_KEY); showLogin(); });

el.createForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const data = new FormData(el.createForm);
  const username = String(data.get("username") ?? "").trim();
  clearMessages(); setBusy(el.createForm, true);
  try {
    await createGuest(username, String(data.get("password") ?? ""));
    el.createForm.reset(); renderAccounts();
    showNotice(`Účet „${username.toLowerCase()}“ je vytvořený.`);
  } catch (err) { showError(describeError(err)); }
  finally { setBusy(el.createForm, false); }
});

el.passwordForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const data = new FormData(el.passwordForm);
  clearMessages(); setBusy(el.passwordForm, true);
  try {
    await changeMyPassword(String(data.get("currentPassword") ?? ""), String(data.get("newPassword") ?? ""));
    el.passwordForm.reset(); showNotice("Heslo je změněné.");
  } catch (err) { showError(describeError(err)); }
  finally { setBusy(el.passwordForm, false); }
});

el.list.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const item = btn.closest("li[data-id]");
  const id = item?.dataset.id, username = item?.dataset.username ?? "";
  if (btn.dataset.action === "edit") { clearMessages(); state.editingId = state.editingId === id ? null : id; renderAccounts(); }
  else if (btn.dataset.action === "cancel") { state.editingId = null; renderAccounts(); }
  else if (btn.dataset.action === "delete") {
    if (!window.confirm(`Smazat účet „${username}“? Uživatel se přestane moci přihlásit.`)) return;
    try { deleteAccount(id); showNotice(`Účet „${username}“ byl smazán.`); }
    catch (err) { showError(describeError(err)); }
    renderAccounts();
  }
});

el.list.addEventListener("submit", async (e) => {
  const form = e.target.closest('form[data-form="edit"]');
  if (!form) return;
  e.preventDefault();
  const id = form.closest("li[data-id]").dataset.id;
  const data = new FormData(form);
  const username = String(data.get("username") ?? "").trim();
  const password = String(data.get("password") ?? "");
  clearMessages(); setBusy(form, true);
  try {
    await updateAccount(id, { ...(username ? { username } : {}), ...(password ? { password } : {}) });
    state.editingId = null; renderAccounts(); showNotice("Změny jsou uložené.");
  } catch (err) { showError(describeError(err)); setBusy(form, false); }
});

if (!window.crypto?.subtle) {
